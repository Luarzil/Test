name: Build trading progress video

on:
  push:
    paths:
      - 'trading-video/build_trading_video.py'
      - '.github/workflows/build-trading-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build narrated MP4
        run: python trading-video/build_trading_video.py
      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-video/output/Trading_Project_Progress_Pulse_Anchor_JennyNeural.mp4 trading-video/output/VOICE_AND_BUILD.txt
          git commit -m "Add narrated trading progress video [skip ci]" || exit 0
          git push
